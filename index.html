<style>
/* Layout: sticky zoekbalk + chips boven, kaartenraster in het midden, vaste speler onderaan, zwevend beeldpaneel */
:root{
  --bg:#f3f5f9; --surface:#ffffff; --surface2:#e8ecf5; --fg:#12182b; --muted:#59647f; --line:#d8deec;
  --accent:#2f5bff; --accent-fg:#ffffff; --danger:#c23b3b; --shadow:0 8px 30px rgba(18,24,43,.12);
  --font-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --font-body:"Figtree","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0b0f1f; --surface:#141a2f; --surface2:#1d2543; --fg:#eaeefc; --muted:#98a3c6; --line:#262f50;
    --accent:#7494ff; --accent-fg:#0b0f1f; --danger:#ff7b7b; --shadow:0 8px 30px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b0f1f; --surface:#141a2f; --surface2:#1d2543; --fg:#eaeefc; --muted:#98a3c6; --line:#262f50;
  --accent:#7494ff; --accent-fg:#0b0f1f; --danger:#ff7b7b; --shadow:0 8px 30px rgba(0,0,0,.45);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:400 16px/1.45 var(--font-body);padding-bottom:130px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.wrap{max-width:1280px;margin:0 auto;padding-inline:16px}

header.top{position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top,0px);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.bar{display:flex;gap:12px;align-items:center;padding-block:12px;flex-wrap:wrap}
.brand{font:800 1.5rem/1 var(--font-display);letter-spacing:-.02em;margin-right:auto;display:flex;align-items:center;gap:10px}
.brand svg{width:30px;height:30px;color:var(--accent)}
.brand small{font:500 .8rem var(--font-body);color:var(--muted);letter-spacing:0}
.search{flex:1 1 260px;max-width:420px;position:relative}
.search input{width:100%;padding:11px 14px 11px 40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);outline-offset:2px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.iconbtn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.iconbtn:hover{background:var(--surface2)}
.iconbtn svg{width:20px;height:20px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;scrollbar-width:thin}
.chip{flex:none;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:500;font-size:.9rem;white-space:nowrap}
.chip:hover{background:var(--surface2)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}

.meta{display:flex;justify-content:space-between;align-items:baseline;padding-block:18px 6px;gap:12px;flex-wrap:wrap}
.meta h1{font:800 1.35rem var(--font-display);margin:0;letter-spacing:-.01em}
.meta span{color:var(--muted);font-size:.9rem}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;padding-block:8px 24px}
.card{position:relative;display:flex;gap:12px;align-items:center;text-align:left;padding:12px;border-radius:16px;border:1px solid var(--line);background:var(--surface);min-width:0;width:100%}
.card:hover{border-color:color-mix(in srgb,var(--accent) 50%,var(--line))}
.card[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 35%,transparent)}
.tile{flex:none;width:52px;height:52px;border-radius:14px;display:grid;place-items:center;color:#fff;font:800 1.15rem var(--font-display);letter-spacing:-.02em;position:relative;overflow:hidden}
.card .txt{min-width:0;flex:1;padding-right:30px}
.card .name{font-weight:600;line-height:1.25;overflow-wrap:anywhere;display:block}
.card .sub{font-size:.8rem;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.badge{font-size:.68rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:1px 7px;border-radius:999px;background:var(--accent);color:var(--accent-fg)}
.card .fav,.card .del{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:9px;border:0;background:transparent;display:grid;place-items:center;color:var(--muted)}
.card .del{top:auto;bottom:8px}
.card .fav:hover,.card .del:hover{background:var(--surface2)}
.card .fav[aria-pressed="true"]{color:#e0457b}
.card .fav svg,.card .del svg{width:18px;height:18px}
.eq{position:absolute;inset:0;background:rgba(10,14,30,.62);display:none;align-items:flex-end;justify-content:center;gap:3px;padding-bottom:13px}
.card[aria-current="true"] .eq{display:flex}
.eq i{width:4px;height:6px;background:#fff;border-radius:2px;animation:eq 0.9s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:-.3s}.eq i:nth-child(3){animation-delay:-.6s}
body:not(.is-playing) .eq i{animation-play-state:paused}
@keyframes eq{0%,100%{height:6px}50%{height:22px}}
.empty{grid-column:1/-1;padding:48px 16px;text-align:center;color:var(--muted)}

/* Speler */
.player{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);box-shadow:var(--shadow);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.player .in{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:16px;align-items:center}
.now{display:flex;gap:12px;align-items:center;min-width:0}
.now .tile{width:48px;height:48px;border-radius:12px;background:var(--surface2);color:var(--muted)}
.now .t{min-width:0}
.now .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now .t span{display:block;font-size:.85rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now .t span.err{color:var(--danger)}
.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--danger);margin-right:6px;vertical-align:middle}
.ctrl{display:flex;gap:8px;align-items:center}
.ctrl button{width:44px;height:44px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center}
.ctrl button:hover{background:var(--surface2)}
.ctrl button svg{width:22px;height:22px}
.ctrl .play{width:56px;height:56px;background:var(--accent);color:var(--accent-fg)}
.ctrl .play:hover{background:var(--accent);filter:brightness(1.08)}
.ctrl .play svg{width:26px;height:26px}
.right{display:flex;gap:10px;align-items:center;justify-content:flex-end}
.right input[type=range]{width:110px;accent-color:var(--accent)}
.pill{display:flex;gap:6px;align-items:center;height:42px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:500;font-size:.9rem}
.pill:hover{background:var(--surface2)}
.pill svg{width:20px;height:20px}
.pill[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}

/* Beeldpaneel */
.vpanel{position:fixed;right:16px;bottom:calc(100px + env(safe-area-inset-bottom,0px));z-index:25;width:min(480px,calc(100vw - 32px));background:#000;border-radius:16px;overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--line)}
.vpanel video{display:block;width:100%;aspect-ratio:16/9;background:#000}
.vpanel .cap{position:absolute;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;pointer-events:none}
.vpanel .cap span{background:rgba(0,0,0,.6);color:#fff;font-size:.8rem;padding:3px 10px;border-radius:999px}
.vpanel .cap button{pointer-events:auto;border:0;background:rgba(0,0,0,.6);color:#fff;border-radius:999px;width:30px;height:30px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(110px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;max-width:min(520px,calc(100vw - 32px));box-shadow:var(--shadow);font-size:.92rem}

dialog{border:1px solid var(--line);border-radius:18px;background:var(--surface);color:var(--fg);padding:0;width:min(460px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(5,8,20,.55)}
dialog form{padding:20px;display:grid;gap:14px}
dialog h2{margin:0;font:800 1.2rem var(--font-display)}
dialog label{display:grid;gap:5px;font-weight:500;font-size:.9rem}
dialog label small{color:var(--muted);font-weight:400}
dialog input{padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
dialog .row{display:flex;gap:10px;justify-content:flex-end}
.btn{padding:10px 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}

@media (max-width:760px){
  body{padding-bottom:168px}
  .player .in{grid-template-columns:minmax(0,1fr) auto;gap:10px 12px}
  .right{grid-column:1/-1;justify-content:space-between}
  .right input[type=range]{flex:1;width:auto}
  .vpanel{bottom:calc(158px + env(safe-area-inset-bottom,0px));right:16px;left:16px;width:auto}
  .toast{bottom:calc(170px + env(safe-area-inset-bottom,0px))}
  .pill span{display:none}
  .pill{padding:0 12px}
}
@media (prefers-reduced-motion:reduce){.eq i{animation:none;height:14px}}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="bar">
      <div class="brand">
        <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="16" cy="18" r="3.2" fill="currentColor" stroke="none"/><path d="M9.5 11.5a9.2 9.2 0 0 0 0 13M22.5 11.5a9.2 9.2 0 0 1 0 13M5 7.5a15.5 15.5 0 0 0 0 21M27 7.5a15.5 15.5 0 0 1 0 21"/></svg>
        <span>Radiostreams <small id="count"></small></span>
      </div>
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Zoek een zender" aria-label="Zoek een zender" autocomplete="off">
      </div>
      <button class="pill" id="installBtn" hidden title="Installeer als app"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7.5 10.5 12 15l4.5-4.5M5 19h14"/></svg><span>Installeer</span></button>
      <button class="iconbtn" id="addBtn" title="Eigen zender toevoegen" aria-label="Eigen zender toevoegen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
      <button class="iconbtn" id="themeBtn" title="Thema wisselen" aria-label="Thema wisselen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
    </div>
    <div class="chips" id="chips" role="group" aria-label="Categorie"></div>
  </div>
</header>

<main class="wrap">
  <div class="meta"><h1 id="heading">Alle zenders</h1><span id="hint"></span></div>
  <div class="grid" id="grid"></div>
</main>

<div class="vpanel" id="vpanel" hidden>
  <video id="media" playsinline preload="none"></video>
  <div class="cap"><span id="vname"></span><button id="vclose" aria-label="Alleen audio" title="Alleen audio">✕</button></div>
</div>

<footer class="player">
  <div class="in">
    <div class="now">
      <div class="tile" id="nowTile"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 18V5l11-2v13"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/></svg></div>
      <div class="t"><b id="nowName">Kies een zender</b><span id="nowStatus">Tik op een zender om te luisteren</span></div>
    </div>
    <div class="ctrl">
      <button id="prev" aria-label="Vorige zender"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9.5 12z"/></svg></button>
      <button class="play" id="toggle" aria-label="Afspelen"><svg id="icoPlay" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg><svg id="icoPause" viewBox="0 0 24 24" fill="currentColor" hidden><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg></button>
      <button id="next" aria-label="Volgende zender"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5l10.5 7L4 19z"/></svg></button>
    </div>
    <div class="right">
      <button class="pill" id="videoBtn" aria-pressed="false" hidden title="Live beeld tonen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="m16 10 5-3v10l-5-3z"/></svg><span>Beeld</span></button>
      <button class="pill" id="castBtn" aria-pressed="false" title="Casten naar tv of speaker"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8V6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-5"/><path d="M3 12a9 9 0 0 1 9 9M3 16a5 5 0 0 1 5 5M3 20h.01"/></svg><span>Cast</span></button>
      <input type="range" id="vol" min="0" max="1" step="0.01" value="0.8" aria-label="Volume">
    </div>
  </div>
</footer>

<dialog id="dlg">
  <form method="dialog" id="addForm">
    <h2>Eigen zender toevoegen</h2>
    <label>Naam<input id="fName" required maxlength="60" placeholder="Bijvoorbeeld Radio Dorpsstraat"></label>
    <label>Stream-adres<small>Een mp3-, aac- of m3u8-link</small><input id="fUrl" required type="url" placeholder="https://…"></label>
    <label>Adres voor live beeld<small>Optioneel, een m3u8-link met video</small><input id="fVideo" type="url" placeholder="https://…"></label>
    <div class="row"><button type="button" class="btn" id="fCancel">Annuleren</button><button class="btn primary" type="submit">Toevoegen</button></div>
  </form>
</dialog>

<script>
(function(){
  "use strict";
  var $ = function(s){ return document.querySelector(s); };
  var store = {
    get: function(k, d){ try { var v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch(e){ return d; } },
    set: function(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
  };

  // ---------- Data ----------
  var CAT_CUSTOM = "Eigen zenders";
  var stations = [], cats = [];
  function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g, "-"); }
  (function parse(){
    var cat = "";
    $("#data").textContent.split("\n").forEach(function(line){
      line = line.trim(); if(!line) return;
      if(line[0] === "#"){ cat = line.slice(1).trim(); if(cats.indexOf(cat) < 0) cats.push(cat); return; }
      var p = line.split("|").map(function(x){ return x.trim(); });
      stations.push({ id: slug(cat + " " + p[0]), name: p[0], cat: cat, urls: p[1].split(/\s+/), video: p[2] || "" });
    });
  })();
  var custom = store.get("rs.custom", []);
  function allStations(){
    var c = custom.map(function(s){ return { id: s.id, name: s.name, cat: CAT_CUSTOM, urls: s.urls, video: s.video || "", custom: true }; });
    return c.concat(stations);
  }
  var favs = store.get("rs.favs", []);

  // ---------- State ----------
  var state = { cat: "all", q: "", cur: null, idx: 0, video: false };
  var media = $("#media");
  var hls = null;

  function hue(name){ var h = 0; for(var i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) % 360; return h; }
  function initials(name){
    var w = name.replace(/[^\p{L}\p{N}\s]/gu, " ").trim().split(/\s+/);
    if(/^\d/.test(w[0])) return w[0].slice(0, 3);
    return (w[0][0] + (w[1] ? w[1][0] : (w[0][1] || ""))).toUpperCase();
  }
  function esc(s){ return s.replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

  // ---------- Chips ----------
  function renderChips(){
    var list = [["all","Alles"],["fav","Favorieten"],["video","Met beeld"]];
    cats.forEach(function(c){ list.push([c, c]); });
    if(custom.length) list.push([CAT_CUSTOM, CAT_CUSTOM]);
    $("#chips").innerHTML = list.map(function(c){
      return '<button class="chip" data-cat="' + esc(c[0]) + '" aria-pressed="' + (state.cat === c[0]) + '">' + esc(c[1]) + '</button>';
    }).join("");
  }
  $("#chips").addEventListener("click", function(e){
    var b = e.target.closest(".chip"); if(!b) return;
    state.cat = b.dataset.cat; renderChips(); render();
  });

  // ---------- Grid ----------
  function visible(){
    var q = state.q.trim().toLowerCase();
    return allStations().filter(function(s){
      if(state.cat === "fav" && favs.indexOf(s.id) < 0) return false;
      if(state.cat === "video" && !s.video) return false;
      if(state.cat !== "all" && state.cat !== "fav" && state.cat !== "video" && s.cat !== state.cat) return false;
      if(q && (s.name + " " + s.cat).toLowerCase().indexOf(q) < 0) return false;
      return true;
    });
  }
  var heart = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-9.6-9.2C.8 8.3 2.7 5 6 5c2 0 3.4 1.1 4 2.3h4C14.6 6.1 16 5 18 5c3.3 0 5.2 3.3 3.6 6.8C19.5 16.4 12 21 12 21z"/></svg>';
  var trash = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12h10l1-12M9 7V4h6v3"/></svg>';
  function render(){
    var list = visible();
    var title = state.cat === "all" ? "Alle zenders" : state.cat === "fav" ? "Favorieten" : state.cat === "video" ? "Zenders met live beeld" : state.cat;
    $("#heading").textContent = state.q ? "Zoekresultaten" : title;
    $("#hint").textContent = list.length + (list.length === 1 ? " zender" : " zenders");
    $("#count").textContent = "· " + (stations.length + custom.length) + " zenders";
    if(!list.length){
      $("#grid").innerHTML = '<div class="empty">' + (state.cat === "fav" ? "Nog geen favorieten. Tik op het hartje bij een zender." : "Geen zenders gevonden.") + '</div>';
      return;
    }
    $("#grid").innerHTML = list.map(function(s){
      var h = hue(s.name), isCur = state.cur && state.cur.id === s.id;
      return '<div class="cardwrap" style="position:relative;min-width:0">' +
        '<button class="card" data-id="' + esc(s.id) + '" aria-current="' + !!isCur + '">' +
          '<span class="tile" style="background:linear-gradient(135deg,hsl(' + h + ' 62% 46%),hsl(' + ((h + 40) % 360) + ' 62% 38%))">' + esc(initials(s.name)) +
          '<span class="eq" aria-hidden="true"><i></i><i></i><i></i></span></span>' +
          '<span class="txt"><span class="name">' + esc(s.name) + '</span>' +
          '<span class="sub">' + esc(s.cat) + (s.video ? ' <span class="badge">Beeld</span>' : '') + '</span></span>' +
        '</button>' +
        '<button class="fav" style="position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:9px;border:0;background:transparent;display:grid;place-items:center;color:' + (favs.indexOf(s.id) >= 0 ? '#e0457b' : 'var(--muted)') + '" data-fav="' + esc(s.id) + '" aria-pressed="' + (favs.indexOf(s.id) >= 0) + '" aria-label="Favoriet: ' + esc(s.name) + '">' + heart.replace("<svg", '<svg style="width:18px;height:18px"') + '</button>' +
        (s.custom ? '<button class="del" style="position:absolute;bottom:8px;right:8px;width:30px;height:30px;border-radius:9px;border:0;background:transparent;display:grid;place-items:center;color:var(--muted)" data-del="' + esc(s.id) + '" aria-label="Verwijder ' + esc(s.name) + '">' + trash.replace("<svg", '<svg style="width:18px;height:18px"') + '</button>' : '') +
      '</div>';
    }).join("");
  }
  $("#grid").addEventListener("click", function(e){
    var f = e.target.closest("[data-fav]");
    if(f){ var id = f.dataset.fav, i = favs.indexOf(id); if(i >= 0) favs.splice(i, 1); else favs.push(id); store.set("rs.favs", favs); render(); return; }
    var d = e.target.closest("[data-del]");
    if(d){ custom = custom.filter(function(s){ return s.id !== d.dataset.del; }); store.set("rs.custom", custom); if(state.cat === CAT_CUSTOM && !custom.length) state.cat = "all"; renderChips(); render(); return; }
    var c = e.target.closest(".card");
    if(c){ var st = allStations().filter(function(s){ return s.id === c.dataset.id; })[0]; if(st) play(st, false); }
  });
  $("#q").addEventListener("input", function(e){ state.q = e.target.value; render(); });

  // ---------- Playback ----------
  function sources(){ var s = state.cur; return state.video && s.video ? [s.video].concat(s.urls) : s.urls; }
  function destroyHls(){ if(hls){ try { hls.destroy(); } catch(e){} hls = null; } }
  function attach(url){
    destroyHls();
    media.removeAttribute("src"); media.load();
    if(/\.m3u8(\?|$)/i.test(url)){
      if(media.canPlayType("application/vnd.apple.mpegurl")){ media.src = url; }
      else if(window.Hls && Hls.isSupported()){
        hls = new Hls({ lowLatencyMode: false });
        hls.on(Hls.Events.ERROR, function(_, d){ if(d.fatal) onFail(); });
        hls.loadSource(url); hls.attachMedia(media);
      } else { onFail(); return false; }
    } else { media.src = url; }
    return true;
  }
  function startSource(){
    var url = sources()[state.idx];
    if(!url){ fail(); return; }
    if(location.protocol === "https:" && url.indexOf("http:") === 0){ state.skipped = true; state.idx++; startSource(); return; }
    setStatus("Verbinden…");
    if(!attach(url)) return;
    var p = media.play();
    if(p && p.catch) p.catch(function(err){ if(err && err.name !== "AbortError" && err.name !== "NotAllowedError") onFail(); else if(err && err.name === "NotAllowedError") setStatus("Tik op afspelen om te starten"); });
  }
  function onFail(){ state.idx++; startSource(); }
  function fail(){
    var msg = state.skipped ? "Deze stream gebruikt http. Open dit bestand lokaal of via http." : "Stream niet bereikbaar. Probeer een andere zender.";
    setStatus(msg, true);
    document.body.classList.remove("is-playing");
  }
  function play(st, video){
    state.cur = st; state.idx = 0; state.skipped = false; state.video = !!(video && st.video);
    store.set("rs.last", st.id);
    updateNow(); updateVideoUI(); render(); startSource(); updateSession();
  }
  function setStatus(t, err, live){
    var el = $("#nowStatus");
    el.className = err ? "err" : "";
    el.innerHTML = live ? '<i class="live"></i>' + esc(t) : esc(t);
  }
  function updateNow(){
    var s = state.cur; if(!s) return;
    $("#nowName").textContent = s.name;
    var t = $("#nowTile"), h = hue(s.name);
    t.style.background = "linear-gradient(135deg,hsl(" + h + " 62% 46%),hsl(" + ((h + 40) % 360) + " 62% 38%))";
    t.style.color = "#fff"; t.style.fontFamily = "var(--font-display)"; t.style.fontWeight = "800";
    t.textContent = initials(s.name);
    $("#videoBtn").hidden = !s.video;
  }
  function updateVideoUI(){
    var on = state.video && state.cur && state.cur.video;
    $("#vpanel").hidden = !on;
    $("#videoBtn").setAttribute("aria-pressed", String(!!on));
    $("#vname").textContent = state.cur ? state.cur.name + " · live beeld" : "";
  }
  $("#videoBtn").addEventListener("click", function(){
    if(!state.cur || !state.cur.video) return;
    state.video = !state.video; state.idx = 0; state.skipped = false;
    updateVideoUI(); startSource();
  });
  $("#vclose").addEventListener("click", function(){
    state.video = false; state.idx = 0; updateVideoUI(); startSource();
  });

  function setPlayingUI(on){
    $("#icoPlay").hidden = on; $("#icoPause").hidden = !on;
    $("#toggle").setAttribute("aria-label", on ? "Pauzeren" : "Afspelen");
    document.body.classList.toggle("is-playing", on);
  }
  media.addEventListener("playing", function(){ setPlayingUI(true); setStatus("Live", false, true); });
  media.addEventListener("waiting", function(){ if(state.cur) setStatus("Bufferen…"); });
  media.addEventListener("pause", function(){ setPlayingUI(false); if(state.cur && !media.ended) setStatus("Gepauzeerd"); });
  media.addEventListener("error", function(){ if(state.cur && media.getAttribute("src")) onFail(); });
  media.addEventListener("stalled", function(){ /* wacht op herstel */ });

  $("#toggle").addEventListener("click", togglePlay);
  function togglePlay(){
    if(!state.cur){ var l = visible()[0]; if(l) play(l, false); return; }
    if(media.paused){
      // Bij live radio liever opnieuw verbinden dan oude buffer afspelen
      if(!state.video || !media.src) { state.idx = 0; state.skipped = false; startSource(); }
      else media.play().catch(function(){ state.idx = 0; startSource(); });
    } else { media.pause(); }
  }
  function step(d){
    var list = visible(); if(!list.length) return;
    var i = state.cur ? list.findIndex(function(s){ return s.id === state.cur.id; }) : -1;
    var n = list[(i + d + list.length) % list.length];
    play(n, false);
  }
  $("#prev").addEventListener("click", function(){ step(-1); });
  $("#next").addEventListener("click", function(){ step(1); });

  var vol = store.get("rs.vol", 0.8);
  media.volume = vol; $("#vol").value = vol;
  $("#vol").addEventListener("input", function(e){ media.volume = +e.target.value; store.set("rs.vol", +e.target.value); });

  document.addEventListener("keydown", function(e){
    if(e.code === "Space" && document.activeElement === document.body){ e.preventDefault(); togglePlay(); }
  });

  // Media Session (vergrendelscherm, mediatoetsen)
  function updateSession(){
    if(!("mediaSession" in navigator) || !state.cur) return;
    try { navigator.mediaSession.metadata = new MediaMetadata({ title: state.cur.name, artist: "Radiostreams NL", album: state.cur.cat }); } catch(e){}
  }
  if("mediaSession" in navigator){
    try {
      navigator.mediaSession.setActionHandler("play", togglePlay);
      navigator.mediaSession.setActionHandler("pause", function(){ media.pause(); });
      navigator.mediaSession.setActionHandler("previoustrack", function(){ step(-1); });
      navigator.mediaSession.setActionHandler("nexttrack", function(){ step(1); });
    } catch(e){}
  }

  // ---------- Casten ----------
  var toastTimer;
  function toast(t){
    var old = $(".toast"); if(old) old.remove();
    var d = document.createElement("div"); d.className = "toast"; d.setAttribute("role", "status"); d.textContent = t;
    document.body.appendChild(d); clearTimeout(toastTimer); toastTimer = setTimeout(function(){ d.remove(); }, 5000);
  }
  $("#castBtn").addEventListener("click", function(){
    if(!state.cur){ toast("Kies eerst een zender en tik dan op Cast."); return; }
    if(hls){ toast("Deze stream loopt via een HLS-speler en kan in Chrome niet gecast worden. Probeer Safari (AirPlay) of een andere zender."); return; }
    if(media.remote && media.remote.prompt){
      media.remote.prompt().catch(function(err){
        if(err && err.name === "NotFoundError") toast("Geen cast-apparaten gevonden op dit netwerk.");
        else if(err && err.name === "NotSupportedError") toast("Casten van deze stream wordt niet ondersteund.");
        else if(err && err.name !== "AbortError") toast("Casten is niet gelukt. Controleer of je tv of speaker op hetzelfde wifi-netwerk zit.");
      });
    } else if(media.webkitShowPlaybackTargetPicker){
      media.webkitShowPlaybackTargetPicker();
    } else {
      toast("Casten werkt in Chrome en Edge (Chromecast, Google Cast) en in Safari (AirPlay). Firefox ondersteunt dit niet.");
    }
  });
  if(media.remote){
    var setCast = function(){ $("#castBtn").setAttribute("aria-pressed", String(media.remote.state === "connected")); };
    media.remote.addEventListener("connect", setCast);
    media.remote.addEventListener("disconnect", setCast);
    media.remote.addEventListener("connecting", setCast);
  }

  // ---------- Eigen zender ----------
  var dlg = $("#dlg");
  $("#addBtn").addEventListener("click", function(){ $("#addForm").reset(); dlg.showModal(); $("#fName").focus(); });
  $("#fCancel").addEventListener("click", function(){ dlg.close(); });
  $("#addForm").addEventListener("submit", function(e){
    e.preventDefault();
    var name = $("#fName").value.trim(), url = $("#fUrl").value.trim(), v = $("#fVideo").value.trim();
    if(!name || !url) return;
    custom.unshift({ id: "eigen-" + Date.now(), name: name, urls: [url], video: v });
    store.set("rs.custom", custom); dlg.close();
    state.cat = CAT_CUSTOM; renderChips(); render();
  });

  // ---------- Thema ----------
  $("#themeBtn").addEventListener("click", function(){
    var r = document.documentElement, cur = r.getAttribute("data-theme");
    var dark = cur ? cur === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    var next = dark ? "light" : "dark";
    r.setAttribute("data-theme", next); store.set("rs.theme", next);
  });
  var th = store.get("rs.theme", null); if(th) document.documentElement.setAttribute("data-theme", th);

  // ---------- Installeren als app ----------
  var deferredInstall = null;
  var standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  var installBtn = $("#installBtn");
  window.addEventListener("beforeinstallprompt", function(e){
    e.preventDefault(); deferredInstall = e;
    if(!standalone) installBtn.hidden = false;
  });
  window.addEventListener("appinstalled", function(){ installBtn.hidden = true; deferredInstall = null; toast("Radiostreams staat nu op je beginscherm."); });
  if(isIOS && !standalone) installBtn.hidden = false;
  installBtn.addEventListener("click", function(){
    if(deferredInstall){
      deferredInstall.prompt();
      deferredInstall.userChoice.then(function(){ deferredInstall = null; installBtn.hidden = true; });
    } else if(isIOS){
      toast("Tik op het deel-icoon in Safari en kies 'Zet op beginscherm'.");
    }
  });
  if("serviceWorker" in navigator && /^https?:$/.test(location.protocol)){
    window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
  }

  // ---------- Start ----------
  renderChips(); render();
  var lastId = store.get("rs.last", null);
  var last = lastId && allStations().filter(function(s){ return s.id === lastId; })[0];
  if(last){ state.cur = last; updateNow(); updateVideoUI(); setStatus("Tik op afspelen om verder te luisteren"); render(); }
})();
